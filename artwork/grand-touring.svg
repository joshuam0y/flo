<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- flò Grand Touring back print. The scene keeps its own colours; lettering and frame use the ink (currentColor) -->
  <style>
    @font-face { font-family: Marcellus; src: url("../assets/fonts/marcellus-latin-400-normal.woff2"); }
    @font-face { font-family: Jost; src: url("../assets/fonts/jost-latin-wght-normal.woff2"); font-weight: 100 900; }
    @font-face { font-family: Jost; src: url("../assets/fonts/jost-latin-wght-italic.woff2"); font-style: italic; font-weight: 100 900; }
    @font-face { font-family: Bodoni; src: url("../assets/fonts/bodoni-moda-latin-wght-italic.woff2"); font-style: italic; font-weight: 400 900; }
    .caps { font-family: Jost; font-weight: 500; font-size: 22px; letter-spacing: 9px; fill: currentColor; }
    .mark { font-family: Marcellus; font-size: 196px; letter-spacing: 6px; }
    .tag { font-family: Jost; font-style: italic; font-weight: 600; font-size: 40px; letter-spacing: 8px; fill: currentColor; }
    .script { font-family: Bodoni; font-style: italic; font-size: 26px; fill: currentColor; }
  </style>
  <defs>
    <clipPath id="arch"><path d="M240 770 L240 430 A260 260 0 0 1 760 430 L760 770 Z"/></clipPath>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="3.6" fill="#df8a4e"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotfade"><rect x="240" y="160" width="520" height="420" fill="url(#fade)"/></mask>
    <mask id="sunstripes">
      <rect x="300" y="420" width="400" height="400" fill="#fff"/>
      <rect x="300" y="566" width="400" height="6" fill="#000"/>
      <rect x="300" y="590" width="400" height="9" fill="#000"/>
      <rect x="300" y="613" width="400" height="12" fill="#000"/>
    </mask>
  </defs>

  <text class="caps" x="500" y="110" text-anchor="middle">MAISON DE CONFORT · GRAND TOURING</text>

  <g clip-path="url(#arch)">
