name = "flo-checkout"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
SITE_URL = "https://floshops.com"
CATALOG_URL = "https://floshops.com/assets/data/products.json"
ALLOWED_ORIGINS = "https://floshops.com,https://www.floshops.com"
SHIP_COUNTRIES = "US"
# "false" = orders wait in Printify "On hold" until you press Send to production (safer while testing).
# "true"  = orders go straight into production as soon as the customer pays.
PRINTIFY_AUTO_SEND = "false"
# Joining the email list gives a personal one-time code for this much off a first order, valid this many days
WELCOME_PERCENT = "20"
WELCOME_DAYS = "60"
# The Brevo list sign-ups are added to (the number in Brevo, Contacts, Lists). The API key is a secret:
#   npx wrangler secret put BREVO_API_KEY
BREVO_LIST_ID = "3"

# Loyalty: 1 point per dollar spent on goods (shipping doesn't count). Crossing a multiple of
# LOYALTY_THRESHOLD mints a one-time code for LOYALTY_PERCENT off, valid LOYALTY_DAYS days.
LOYALTY_THRESHOLD = "100"
LOYALTY_PERCENT = "25"
LOYALTY_DAYS = "30"

# Secrets: set these with `npx wrangler secret put NAME`, never commit them:
#   STRIPE_SECRET_KEY        sk_live_... (or sk_test_... while testing)
#   STRIPE_WEBHOOK_SECRET    whsec_...
#   PRINTIFY_TOKEN           Printify personal access token (scopes: orders.read, orders.write)
#   PRINTIFY_SHOP_ID         the number of your Printify store (see README)
#   PRINTIFY_VARIANTS        (optional) JSON map of site SKU -> { "product_id": "...", "variant_id": 12345 }

# Stores email sign-ups and lifetime loyalty points.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "47be34ccf2cc40998b91c619af7fe8ca"
